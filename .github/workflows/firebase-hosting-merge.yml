name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stamp what's being deployed, so the admin "site updated" banner can
      # check what's actually live on Firebase (works even once the repo is
      # private, unlike asking GitHub).
      - run: echo "{\"sha\":\"${{ github.sha }}\",\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > version.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DUNVANTWMC_36DE5 }}
          channelId: live
          projectId: dunvantwmc-36de5

name: Firestore backup

on:
  schedule:
    # 03:00 UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secret is set
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set. See docs/backups.md."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Export Firestore to Cloud Storage
        run: |
          set -e
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%S)
          gcloud firestore export "gs://dunvantwmc-36de5.firebasestorage.app/firestore-backups/$STAMP" \
            --project=dunvantwmc-36de5
          echo "Exported to gs://dunvantwmc-36de5.firebasestorage.app/firestore-backups/$STAMP"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Staff Shout-Outs — Dunvant WMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1512;--paper:#f0e6d6;--card:#faf4e8;--line:#ded0b8;--muted:#6b5d4f;--brass:#a67c3d;--brass-light:#c9a05e;--forest:#2d4a35;--pop:#ff7a45;}
  [data-theme="dark"]{--ink:#ece2d0;--paper:#161210;--card:#211b16;--line:#3a3128;--muted:#a8977f;--brass:#c9a05e;--brass-light:#e0bd82;--forest:#4a7a5c;--pop:#ff9166;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; transition:background 0.25s ease, color 0.25s ease;}
  *, *::before, *::after{transition:background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;}
  header{background:linear-gradient(160deg, #1a1512 0%, #16211a 100%); padding:26px 24px; text-align:center;}
  .eyebrow{display:block; font-size:0.68rem; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--brass-light); margin-bottom:8px;}
  header h1{font-family:'Fraunces', serif; font-weight:600; font-size:1.4rem; color:#fff;}
  header p{font-size:0.8rem; color:rgba(255,255,255,0.55); margin-top:4px;}
  .theme-toggle{
    position:fixed; top:16px; right:16px; z-index:100;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    border-radius:50%; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.05rem;
  }
  .theme-toggle:hover{border-color:var(--brass-light);}
  main{max-width:640px; margin:0 auto; padding:30px 20px 60px;}
  .notice{background:#fff8ea; border:1px solid var(--line); border-radius:10px; padding:16px 20px; font-size:0.84rem; color:var(--muted); margin-bottom:24px;}
  [data-theme="dark"] .notice{background:#2a2318;}

  .form-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:26px;}
  .form-card label{display:block; font-size:0.78rem; font-weight:600; color:var(--forest); margin-bottom:6px;}
  .form-card input, .form-card textarea{
    width:100%; font-family:'Inter', sans-serif; font-size:0.92rem;
    padding:11px 14px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);
    margin-bottom:14px; resize:vertical;
  }
  .form-card textarea{min-height:70px;}
  .submit-btn{
    font-family:'Inter', sans-serif; font-weight:600; font-size:0.9rem;
    background:linear-gradient(135deg, var(--brass-light), var(--brass)); color:#1a1512;
    border:none; border-radius:8px; padding:12px 20px; cursor:pointer; width:100%;
  }
  .form-status{font-size:0.82rem; color:var(--muted); margin-top:10px; text-align:center;}
  .form-status.success{color:#3d8f6f; font-weight:600;}
  .form-status.error{color:#c25a4d; font-weight:600;}

  .section-label{font-family:'Fraunces', serif; font-size:1rem; font-weight:600; color:var(--forest); margin-bottom:14px;}
  .load-status{font-size:0.86rem; color:var(--muted); text-align:center; padding:16px 0;}

  .shoutout-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; margin-bottom:10px; position:relative;
  }
  .shoutout-card::before{content:"🎉"; position:absolute; top:14px; right:16px; font-size:1.1rem;}
  .shoutout-to{font-family:'Fraunces', serif; font-weight:600; font-size:0.98rem; color:var(--forest); margin-bottom:6px; padding-right:28px;}
  .shoutout-message{font-size:0.88rem; line-height:1.45;}
  .shoutout-meta{font-size:0.72rem; color:var(--muted); margin-top:10px;}

  a.back{display:inline-block; margin-top:20px; font-size:0.82rem; color:var(--brass); text-decoration:none; font-weight:600;}
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"><span id="theme-icon">☀️</span></button>

<header>
  <span class="eyebrow">Staff</span>
  <h1>Staff Shout-Outs</h1>
  <p>Give a colleague a bit of credit</p>
</header>
<main>
  <div class="notice">Say a quick thank-you, or call out someone who went above and beyond. Visible to everyone on the team.</div>

  <div class="form-card">
    <label for="shoutout-to">Who's it for?</label>
    <input type="text" id="shoutout-to" list="colleague-list" placeholder="Name">
    <datalist id="colleague-list"></datalist>
    <label for="shoutout-message">Your message</label>
    <textarea id="shoutout-message" placeholder="What did they do?"></textarea>
    <button class="submit-btn" onclick="submitShoutout()">🎉 Post Shout-Out</button>
    <p class="form-status" id="form-status"></p>
  </div>

  <div class="section-label">Recent Shout-Outs</div>
  <p class="load-status" id="load-status">Loading…</p>
  <div id="shoutout-list"></div>

  <a class="back" href="staff-area.html">← Back to Staff Area</a>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBJ9lzipekmOyh6dkcUlY9oObvpXdv__KE",
    authDomain: "dunvantwmc-36de5.firebaseapp.com",
    projectId: "dunvantwmc-36de5",
    storageBucket: "dunvantwmc-36de5.firebasestorage.app",
    messagingSenderId: "826027608283",
    appId: "1:826027608283:web:e2dfe243f70ac77d5624fe"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
</script>
<script>
  let MY_NAME = "";

  function timeAgo(ms){
    if(!ms) return '';
    const mins = Math.floor((Date.now() - ms) / 60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if(hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    return `${days}d ago`;
  }

  function renderShoutouts(docs){
    const listEl = document.getElementById('shoutout-list');
    const statusEl = document.getElementById('load-status');
    if(docs.length === 0){
      listEl.innerHTML = '';
      statusEl.textContent = 'No shout-outs yet — be the first!';
      return;
    }
    statusEl.textContent = '';
    listEl.innerHTML = docs.map(doc => {
      const d = doc.data();
      return `
        <div class="shoutout-card">
          <div class="shoutout-to">For ${d.toName || 'the team'}</div>
          <div class="shoutout-message">${d.message}</div>
          <div class="shoutout-meta">— ${d.fromName || 'Anonymous'} · ${timeAgo(d.createdAtMs)}</div>
        </div>
      `;
    }).join('');
  }

  async function loadShoutouts(){
    const statusEl = document.getElementById('load-status');
    try{
      const snap = await db.collection('shoutouts').get();
      const docs = snap.docs.sort((a, b) => (b.data().createdAtMs || 0) - (a.data().createdAtMs || 0)).slice(0, 40);
      renderShoutouts(docs);
    } catch(e){
      statusEl.textContent = "Couldn't load shout-outs right now — " + e.message;
    }
  }

  async function loadColleagueNames(){
    try{
      const snap = await db.collection('staff').orderBy('name').get();
      const dl = document.getElementById('colleague-list');
      dl.innerHTML = snap.docs.map(d => `<option value="${d.data().name}">`).join('');
    } catch(e){ /* datalist just stays empty */ }
  }

  async function submitShoutout(){
    const toName = document.getElementById('shoutout-to').value.trim();
    const message = document.getElementById('shoutout-message').value.trim();
    const statusEl = document.getElementById('form-status');
    if(!message){
      statusEl.textContent = 'Write a message first.';
      statusEl.className = 'form-status error';
      return;
    }
    statusEl.textContent = 'Posting…';
    statusEl.className = 'form-status';
    try{
      await db.collection('shoutouts').add({
        toName: toName || 'the team',
        message,
        fromName: MY_NAME || 'Anonymous',
        createdAtMs: Date.now(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      document.getElementById('shoutout-to').value = '';
      document.getElementById('shoutout-message').value = '';
      statusEl.textContent = '✓ Posted!';
      statusEl.className = 'form-status success';
      loadShoutouts();
    } catch(e){
      statusEl.textContent = "Couldn't post that — " + e.message;
      statusEl.className = 'form-status error';
    }
  }

  auth.onAuthStateChanged(async (user) => {
    if(!user){
      window.location.href = 'staff-area.html';
      return;
    }
    try{
      const doc = await db.collection('staff').doc(user.uid).get();
      MY_NAME = doc.exists ? (doc.data().name || '') : '';
    } catch(e){ /* keep going without a name */ }
    loadShoutouts();
    loadColleagueNames();
  });

  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const savedTheme = localStorage.getItem('theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
  function applyTheme(theme){
    if(theme === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      themeIcon.textContent = '🌙';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeIcon.textContent = '☀️';
    }
  }
  applyTheme(initialTheme);
  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const newTheme = isDark ? 'light' : 'dark';
    applyTheme(newTheme);
    localStorage.setItem('theme', newTheme);
  });
</script>
<script src="update-banner.js"></script>
</body>
</html>

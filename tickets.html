<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tickets — Dunvant WMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1512;--paper:#f0e6d6;--card:#faf4e8;--line:#ded0b8;--muted:#6b5d4f;--brass:#a67c3d;--brass-light:#c9a05e;--forest:#2d4a35;--pop:#ff7a45;
  }
  [data-theme="dark"]{
    --ink:#ece2d0; --paper:#161210; --card:#211b16; --line:#3a3128; --muted:#a8977f;
    --brass:#c9a05e; --brass-light:#e0bd82; --forest:#4a7a5c;
  --pop:#ff9166;
  }
  body{transition:background 0.25s ease, color 0.25s ease;}
  *, *::before, *::after{transition:background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;}

  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;}
  header{background:linear-gradient(160deg, #1a1512 0%, #16211a 100%); padding:calc(26px + env(safe-area-inset-top)) 24px 26px; text-align:center;}
  .eyebrow{display:block; font-size:0.68rem; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--brass-light); margin-bottom:8px;}
  header h1{font-family:'Fraunces', serif; font-weight:600; font-size:1.4rem; color:#fff;}
  header p{font-size:0.8rem; color:rgba(255,255,255,0.55); margin-top:4px;}
  main{max-width:760px; margin:0 auto; padding:30px 20px 60px;}
  .notice{background:#fff8ea; border:1px solid var(--line); border-radius:10px; padding:16px 20px; font-size:0.84rem; color:var(--muted); margin-bottom:24px;}
  [data-theme="dark"] .notice{background:#2a2318;}

  .filter-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .filter-btn{
    font-family:'Inter', sans-serif; font-size:0.78rem; font-weight:600; padding:7px 14px; border-radius:16px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--muted);
  }
  .filter-btn.active{background:var(--brass); color:#fff; border-color:var(--brass);}
  .load-status{font-size:0.86rem; color:var(--muted); text-align:center; padding:16px 0;}

  .tag{
    font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    padding:3px 9px; border-radius:12px;
  }
  .tag.public{background:#e0e7f0; color:#2f4a6e;}
  .tag.staff{background:#e4ece9; color:#2c3f38;}
  .tag.priority-high{background:#fbe4e4; color:#8a2f2f;}

  .ticket{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:14px;}
  .ticket-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px; flex-wrap:wrap;}
  .ticket-top .badges{display:flex; gap:6px; flex-wrap:wrap;}
  .status{
    font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    padding:4px 10px; border-radius:20px; white-space:nowrap; flex-shrink:0;
  }
  .status.open{background:#fff2d9; color:#8a6a1f;}
  .status.in-progress{background:#dbeafe; color:#1e4a7a;}
  .status.resolved{background:#e4ece9; color:#2c3f38;}
  .details{font-size:0.86rem; color:var(--muted); line-height:1.7; margin-bottom:14px;}
  .details strong{color:var(--ink);}
  .actions{display:flex; gap:10px; flex-wrap:wrap;}
  .actions button{
    font-family:'Inter', sans-serif; font-weight:600; font-size:0.78rem;
    padding:8px 12px; border-radius:6px; cursor:pointer; border:1px solid var(--line); background:var(--paper); color:var(--forest);
  }
  a.back{display:inline-block; margin-top:10px; font-size:0.82rem; color:var(--brass); text-decoration:none; font-weight:600;}
  .theme-toggle{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); right:16px; z-index:100;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    border-radius:50%; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1.05rem;
  }
  .theme-toggle:hover{border-color:var(--brass-light);}
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"><span id="theme-icon">☀️</span></button>

<header>
  <span class="eyebrow">Site Admin</span>
  <h1>Tickets</h1>
  <p>Everything reported via Submit a Ticket and Report an Issue</p>
</header>
<main>
  <div class="notice">Live — pulled straight from the site's own database, both the public "Report an Issue" link and the staff "Submit a Ticket" form.</div>

  <div class="filter-row" id="filter-row"></div>

  <p class="load-status" id="load-status">Loading…</p>
  <div id="ticket-list"></div>

  <a class="back" href="staff-area.html">← Back to Staff Area</a>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBJ9lzipekmOyh6dkcUlY9oObvpXdv__KE",
    authDomain: "dunvantwmc-36de5.firebaseapp.com",
    projectId: "dunvantwmc-36de5",
    storageBucket: "dunvantwmc-36de5.firebasestorage.app",
    messagingSenderId: "826027608283",
    appId: "1:826027608283:web:e2dfe243f70ac77d5624fe"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
</script>
<script>
  let ALL_DOCS = [];
  let ACTIVE_FILTER = 'open';
  const FILTERS = ['open', 'in-progress', 'resolved', 'all'];
  const FILTER_LABELS = { open: 'Open', 'in-progress': 'In Progress', resolved: 'Resolved', all: 'All' };

  function timeAgo(ms){
    if(!ms) return '';
    const mins = Math.floor((Date.now() - ms) / 60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if(hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    return `${days}d ago`;
  }

  function renderFilters(){
    document.getElementById('filter-row').innerHTML = FILTERS.map(f =>
      `<span class="filter-btn ${ACTIVE_FILTER === f ? 'active' : ''}" onclick="setFilter('${f}')">${FILTER_LABELS[f]}</span>`
    ).join('');
  }

  function setFilter(f){
    ACTIVE_FILTER = f;
    renderFilters();
    renderList();
  }

  function renderList(){
    const listEl = document.getElementById('ticket-list');
    const statusEl = document.getElementById('load-status');
    let docs = ALL_DOCS;
    if(ACTIVE_FILTER !== 'all'){
      docs = docs.filter(doc => (doc.data().status || 'open') === ACTIVE_FILTER);
    }
    if(docs.length === 0){
      listEl.innerHTML = '';
      statusEl.textContent = 'Nothing here.';
      return;
    }
    statusEl.textContent = '';
    listEl.innerHTML = docs.map(doc => {
      const d = doc.data();
      const status = d.status || 'open';
      const isStaff = d.type === 'staff';
      return `
        <div class="ticket">
          <div class="ticket-top">
            <div class="badges">
              <span class="tag ${isStaff ? 'staff' : 'public'}">${isStaff ? 'Staff' : 'Public'}</span>
              ${d.category ? `<span class="tag staff">${d.category}</span>` : ''}
              ${d.priority === 'High' ? `<span class="tag priority-high">High Priority</span>` : ''}
            </div>
            <span class="status ${status}">${FILTER_LABELS[status] || status}</span>
          </div>
          <div class="details">
            ${d.description}<br>
            <strong>From:</strong> ${isStaff ? (d.authorName || 'Someone') : (d.name || 'Anonymous')}${d.email ? ' · ' + d.email : ''}
            ${d.page ? `<br><strong>Page:</strong> ${d.page}` : ''}
            <br><strong>Submitted:</strong> ${timeAgo(d.createdAtMs)}
          </div>
          <div class="actions">
            ${status !== 'open' ? `<button onclick="setStatus('${doc.id}', 'open')">Reopen</button>` : ''}
            ${status !== 'in-progress' ? `<button onclick="setStatus('${doc.id}', 'in-progress')">Mark In Progress</button>` : ''}
            ${status !== 'resolved' ? `<button onclick="setStatus('${doc.id}', 'resolved')">Mark Resolved</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  async function loadTickets(){
    const statusEl = document.getElementById('load-status');
    try{
      const snap = await db.collection('tickets').get();
      ALL_DOCS = snap.docs.sort((a, b) => (b.data().createdAtMs || 0) - (a.data().createdAtMs || 0));
      renderFilters();
      renderList();
    } catch(e){
      statusEl.textContent = "Couldn't load tickets right now — " + e.message;
    }
  }

  async function setStatus(id, status){
    try{
      await db.collection('tickets').doc(id).update({ status });
      loadTickets();
    } catch(e){
      alert("Couldn't update that — " + e.message);
    }
  }

  auth.onAuthStateChanged((user) => {
    if(user){
      loadTickets();
    } else {
      window.location.href = 'staff-area.html';
    }
  });

  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const savedTheme = localStorage.getItem('theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
  function applyTheme(theme){
    if(theme === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      themeIcon.textContent = '🌙';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeIcon.textContent = '☀️';
    }
  }
  applyTheme(initialTheme);
  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const newTheme = isDark ? 'light' : 'dark';
    applyTheme(newTheme);
    localStorage.setItem('theme', newTheme);
  });
</script>
<script src="update-banner.js"></script>
</body>
</html>

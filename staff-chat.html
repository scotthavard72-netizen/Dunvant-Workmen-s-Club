<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Staff Chat — Dunvant WMC</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/dw-favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/dw-favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1512;--paper:#f0e6d6;--card:#faf4e8;--line:#ded0b8;--muted:#6b5d4f;--brass:#a67c3d;--brass-light:#c9a05e;--forest:#2d4a35;--pop:#ff7a45;}
  [data-theme="dark"]{--ink:#ece2d0;--paper:#161210;--card:#211b16;--line:#3a3128;--muted:#a8977f;--brass:#c9a05e;--brass-light:#e0bd82;--forest:#4a7a5c;--pop:#ff9166;}
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased; transition:background 0.25s ease, color 0.25s ease; display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;}
  *, *::before, *::after{transition:background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;}
  header{background:linear-gradient(160deg, #1a1512 0%, #16211a 100%); padding:calc(18px + env(safe-area-inset-top)) 24px 16px; text-align:center; flex-shrink:0;}
  .eyebrow{display:block; font-size:0.68rem; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--brass-light); margin-bottom:6px;}
  header h1{font-family:'Fraunces', serif; font-weight:600; font-size:1.3rem; color:#fff;}
  header p{font-size:0.76rem; color:rgba(255,255,255,0.55); margin-top:3px;}
  .theme-toggle, .back-btn{
    position:fixed; top:14px; z-index:100;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    border-radius:50%; width:36px; height:36px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.0rem;
    color:#fff; text-decoration:none;
  }
  .theme-toggle{right:14px;}
  .back-btn{left:14px; font-size:1.15rem;}
  .theme-toggle:hover, .back-btn:hover{border-color:var(--brass-light);}
  main{max-width:640px; margin:0 auto; padding:12px 16px 0; width:100%; flex:1; display:flex; flex-direction:column; min-height:0;}

  .channel-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; flex-shrink:0;}
  .channel-btn{
    flex-shrink:0; font-family:'Inter', sans-serif; font-size:0.82rem; font-weight:600;
    background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:20px;
    padding:9px 16px; cursor:pointer; white-space:nowrap;
  }
  .channel-btn.active{background:linear-gradient(135deg, var(--brass-light), var(--brass)); color:#1a1512; border-color:transparent;}

  .load-status{font-size:0.84rem; color:var(--muted); padding:6px 2px;}
  .empty-note{font-size:0.84rem; color:var(--muted); padding:6px 2px; text-align:center;}

  .messages-pane{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 2px 12px;}
  #messages-list{display:flex; flex-direction:column; gap:8px;}
  .msg-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px 16px 16px 4px;
    padding:9px 13px; max-width:80%; align-self:flex-start;
  }
  .msg-card.own{
    align-self:flex-end; border-radius:16px 16px 4px 16px;
    background:linear-gradient(135deg, var(--brass-light), var(--brass)); color:#1a1512; border-color:transparent;
  }
  .msg-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .msg-author{font-size:0.76rem; font-weight:700; color:var(--forest);}
  .msg-card.own .msg-author{color:#3a2c14; opacity:0.75;}
  .msg-time{font-size:0.68rem; color:var(--muted); white-space:nowrap;}
  .msg-card.own .msg-time{color:#3a2c14; opacity:0.65;}
  .msg-text{font-size:0.92rem; margin-top:3px; line-height:1.38; white-space:pre-wrap; word-break:break-word;}
  .msg-bottom{display:flex; justify-content:flex-end; margin-top:2px;}
  .remove-btn{
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:0.72rem;
    padding:2px 4px; opacity:0.75;
  }
  .msg-card.own .remove-btn{color:#3a2c14;}
  .remove-btn:hover{color:#a24339; opacity:1;}

  .compose-card{background:var(--card); border-top:1px solid var(--line); padding:12px 2px; flex-shrink:0;}
  .compose-card textarea{
    width:100%; font-family:'Inter', sans-serif; font-size:0.92rem;
    padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);
    resize:none; min-height:44px; max-height:120px;
  }
  .compose-card textarea:focus{outline:none; border-color:var(--brass);}
  .compose-row{display:flex; gap:10px; margin-top:8px; align-items:center;}
  .compose-hint{font-size:0.7rem; color:var(--muted); flex:1;}
  button.send{
    font-family:'Inter', sans-serif; font-weight:600; font-size:0.9rem;
    background:linear-gradient(135deg, var(--brass-light), var(--brass)); color:#1a1512;
    border:none; padding:11px 20px; border-radius:8px; cursor:pointer; flex-shrink:0;
  }
  button.send:disabled{opacity:0.6; cursor:default;}
  .form-status{font-size:0.8rem; margin-top:8px; text-align:center; display:none;}
  .form-status.err{color:#a24339; display:block;}
</style>
</head>
<body>
<a class="back-btn" href="staff-hub.html" aria-label="Back to Staff Hub">←</a>
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"><span id="theme-icon">☀️</span></button>

<header>
  <span class="eyebrow">Team</span>
  <h1>Staff Chat</h1>
  <p>Quick messages between shifts — not a replacement for the Diary or Handover Notes</p>
</header>
<main>
  <div class="channel-row" id="channel-row"></div>

  <p class="load-status" id="load-status">Loading…</p>
  <div class="messages-pane" id="messages-pane">
    <div id="messages-list"></div>
  </div>

  <div class="compose-card">
    <textarea id="compose-text" placeholder="Message this channel…" maxlength="500"></textarea>
    <div class="compose-row">
      <span class="compose-hint">Enter to send, Shift+Enter for a new line</span>
      <button class="send" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
    <p class="form-status" id="form-status"></p>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBJ9lzipekmOyh6dkcUlY9oObvpXdv__KE",
    authDomain: "dunvantwmc-36de5.firebaseapp.com",
    projectId: "dunvantwmc-36de5",
    storageBucket: "dunvantwmc-36de5.firebasestorage.app",
    messagingSenderId: "826027608283",
    appId: "1:826027608283:web:e2dfe243f70ac77d5624fe"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
</script>
<script>
  let MY_NAME = '';
  let MY_UID = '';
  let MY_ROLES = [];
  let CAN_MODERATE = false;
  let CURRENT_CHANNEL = 'everyone';
  let refreshTimer = null;
  let cachedMessages = [];

  // Which channels a person can see & post in, based on their roles — same
  // "sees their own tools plus what they oversee" idea as Staff Hub's role
  // tabs (mgmt sees bar/keyholder, admin sees everything).
  const CHANNELS = [
    { key: 'everyone', label: 'Everyone' },
    { key: 'bar', label: 'Bar Staff' },
    { key: 'keyholder', label: 'Keyholder' },
    { key: 'mgmt', label: 'Management' },
    { key: 'committee', label: 'Committee' },
    { key: 'admin', label: 'Site Admin' }
  ];
  const ROLE_EXTRAS = {
    bar: ['bar'],
    keyholder: ['bar', 'keyholder'],
    mgmt: ['bar', 'keyholder', 'mgmt'],
    admin: ['bar', 'keyholder', 'mgmt', 'admin', 'committee'],
    committee: ['committee']
  };

  function myChannelKeys(){
    const extra = new Set();
    MY_ROLES.forEach(r => (ROLE_EXTRAS[r] || []).forEach(k => extra.add(k)));
    return ['everyone', ...CHANNELS.filter(c => c.key !== 'everyone' && extra.has(c.key)).map(c => c.key)];
  }

  function timeAgo(ms){
    if(!ms) return '';
    const date = new Date(ms);
    return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  function renderChannelTabs(){
    const keys = myChannelKeys();
    if(!keys.includes(CURRENT_CHANNEL)) CURRENT_CHANNEL = keys[0];
    document.getElementById('channel-row').innerHTML = keys.map(key => {
      const label = (CHANNELS.find(c => c.key === key) || {}).label || key;
      return `<button class="channel-btn${key === CURRENT_CHANNEL ? ' active' : ''}" onclick="switchChannel('${key}')">${label}</button>`;
    }).join('');
  }

  function switchChannel(key){
    CURRENT_CHANNEL = key;
    renderChannelTabs();
    loadMessages(true);
  }

  function renderMessageCard(doc){
    const d = doc.data();
    const isOwn = d.authorUid === MY_UID;
    const canDelete = isOwn || CAN_MODERATE;
    return `
      <div class="msg-card${isOwn ? ' own' : ''}">
        <div class="msg-top">
          <span class="msg-author">${escapeHtml(d.authorName || 'Someone')}</span>
          <span class="msg-time">${timeAgo(d.createdAtMs)}</span>
        </div>
        <div class="msg-text">${escapeHtml(d.text || '')}</div>
        ${canDelete ? `<div class="msg-bottom"><button class="remove-btn" onclick="removeMessage('${doc.id}')">Remove</button></div>` : ''}
      </div>
    `;
  }

  function escapeHtml(text){
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Whether the message pane is scrolled close enough to the bottom that we
  // should keep it pinned there when new messages come in — like a real
  // chat app, but without yanking someone back down while they're reading
  // older messages further up.
  function isNearBottom(pane){
    return pane.scrollHeight - pane.scrollTop - pane.clientHeight < 120;
  }

  function scrollToBottom(){
    const pane = document.getElementById('messages-pane');
    pane.scrollTop = pane.scrollHeight;
  }

  async function loadMessages(showSpinner){
    const listEl = document.getElementById('messages-list');
    const statusEl = document.getElementById('load-status');
    const pane = document.getElementById('messages-pane');
    const wasNearBottom = showSpinner || isNearBottom(pane);
    if(showSpinner){
      statusEl.textContent = 'Loading…';
      statusEl.style.display = 'block';
    }
    try{
      const snap = await db.collection('staffChat').get();
      const docs = snap.docs
        .filter(d => (d.data().channel || 'everyone') === CURRENT_CHANNEL)
        .sort((a, b) => (a.data().createdAtMs || 0) - (b.data().createdAtMs || 0))
        .slice(-100);
      cachedMessages = docs;
      statusEl.style.display = 'none';
      listEl.innerHTML = docs.length
        ? docs.map(renderMessageCard).join('')
        : '<p class="empty-note">No messages in this channel yet — say hello.</p>';
      if(wasNearBottom) scrollToBottom();
    } catch(e){
      if(showSpinner) statusEl.textContent = e.code === 'permission-denied'
        ? "Couldn't load messages — Site Admin needs to update Firestore's access rules for this to work."
        : "Couldn't load messages — try refreshing.";
    }
  }

  async function sendMessage(){
    const textEl = document.getElementById('compose-text');
    const statusEl = document.getElementById('form-status');
    const text = textEl.value.trim();
    if(!text) return;

    const sendBtn = document.getElementById('send-btn');
    sendBtn.disabled = true;
    try{
      await db.collection('staffChat').add({
        channel: CURRENT_CHANNEL,
        authorUid: MY_UID,
        authorName: MY_NAME || 'Someone',
        text,
        createdAtMs: Date.now(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      textEl.value = '';
      statusEl.style.display = 'none';
      await loadMessages(false);
      scrollToBottom();
    } catch(e){
      statusEl.textContent = e.code === 'permission-denied'
        ? "Couldn't send — Site Admin needs to update Firestore's access rules for this to work."
        : "Couldn't send that — try again in a moment.";
      statusEl.className = 'form-status err';
    }
    sendBtn.disabled = false;
  }

  async function removeMessage(id){
    if(!confirm('Remove this message?')) return;
    try{
      await db.collection('staffChat').doc(id).delete();
      loadMessages(false);
    } catch(e){
      alert("Couldn't remove it — " + e.message);
    }
  }

  document.getElementById('compose-text').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  auth.onAuthStateChanged(async (user) => {
    if(!user){
      window.location.href = 'staff-area.html';
      return;
    }
    MY_UID = user.uid;
    try{
      const doc = await db.collection('staff').doc(user.uid).get();
      const data = doc.exists ? doc.data() : {};
      MY_NAME = data.name || '';
      MY_ROLES = data.roles || [];
    } catch(e){ /* keep going without a name/roles */ }
    CAN_MODERATE = MY_ROLES.some(r => ['admin', 'mgmt'].includes(r));
    renderChannelTabs();
    loadMessages(true);
    // Poll for new messages while the page is open — a lightweight stand-in
    // for a live listener, matching the rest of the site's simple style.
    refreshTimer = setInterval(() => {
      if(document.visibilityState === 'visible') loadMessages(false);
    }, 5000);
  });

  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const savedTheme = localStorage.getItem('theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
  function applyTheme(theme){
    if(theme === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      themeIcon.textContent = '🌙';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeIcon.textContent = '☀️';
    }
  }
  applyTheme(initialTheme);
  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const newTheme = isDark ? 'light' : 'dark';
    applyTheme(newTheme);
    localStorage.setItem('theme', newTheme);
  });
</script>
<script src="update-banner.js"></script>
</body>
</html>

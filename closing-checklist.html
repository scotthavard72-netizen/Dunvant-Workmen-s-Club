<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Closing Checklist — Dunvant WMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1512;--paper:#f0e6d6;--card:#faf4e8;--line:#ded0b8;--muted:#6b5d4f;--brass:#a67c3d;--brass-light:#c9a05e;--forest:#2d4a35;--pop:#ff7a45;
  }
  [data-theme="dark"]{
    --ink:#ece2d0; --paper:#161210; --card:#211b16; --line:#3a3128; --muted:#a8977f;
    --brass:#c9a05e; --brass-light:#e0bd82; --forest:#4a7a5c;
  --pop:#ff9166;
  }
  body{transition:background 0.25s ease, color 0.25s ease;}
  *, *::before, *::after{transition:background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;}

  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;}
  header{background:linear-gradient(160deg, #1a1512 0%, #16211a 100%); padding:calc(26px + env(safe-area-inset-top)) 24px 26px; text-align:center;}
  .eyebrow{display:block; font-size:0.68rem; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--brass-light); margin-bottom:8px;}
  header h1{font-family:'Fraunces', serif; font-weight:600; font-size:1.4rem; color:#fff;}
  header p{font-size:0.8rem; color:rgba(255,255,255,0.55); margin-top:4px;}
  main{max-width:640px; margin:0 auto; padding:30px 20px 60px;}
  .notice{background:#fff8ea; border:1px solid var(--line); border-radius:10px; padding:16px 20px; font-size:0.84rem; color:var(--muted); margin-bottom:24px;}
  [data-theme="dark"] .notice{background:#2a2318;}
  .item{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-bottom:10px;
    cursor:pointer; user-select:none;
  }
  .item input[type="checkbox"]{width:20px; height:20px; accent-color:var(--forest); flex-shrink:0;}
  .item .num{flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--forest); color:#fff; font-size:0.78rem; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .item .text{font-size:0.94rem; line-height:1.4;}
  .item.checked{opacity:0.5;}
  .item.checked .text{text-decoration:line-through;}
  .action-btns{display:flex; gap:8px;}
  .reset-btn{font-family:'Inter', sans-serif; font-weight:600; font-size:0.82rem; background:none; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:10px 14px; cursor:pointer;}
  a.back{display:inline-block; margin-top:26px; font-size:0.82rem; color:var(--brass); text-decoration:none; font-weight:600;}
  .action-row{display:flex; justify-content:space-between; align-items:center; margin-top:26px;}
  .action-row a.back{margin-top:0;}
  .print-btn{
    font-family:'Inter', sans-serif; font-weight:600; font-size:0.82rem;
    background:var(--forest); color:#fff; border:none; border-radius:8px;
    padding:10px 18px; cursor:pointer;
  }
  @media print{
    header{background:none !important; padding:0 0 16px;}
    header h1{color:var(--ink) !important;}
    header p, .eyebrow{color:var(--muted) !important;}
    .notice, .action-row{display:none;}
    .item{border:1px solid #ccc; break-inside:avoid;}
    body{background:#fff;}
  }
  .theme-toggle{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); right:16px; z-index:100;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    border-radius:50%; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1.05rem;
  }
  .theme-toggle:hover{border-color:var(--brass-light);}
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"><span id="theme-icon">☀️</span></button>

<header>
  <span class="eyebrow">Bar Staff · Keyholder</span>
  <h1>Closing Checklist</h1>
  <p>Locking up procedure — The Dunvant Club</p>
</header>
<main>
  <div class="notice">The club's locking-up procedure, in order — the same as the sheet on the wall. Tick each step as you go. Ticks are just for you on this device; tap "Start again" for the next night.</div>

  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">1</span><span class="text">Escort last customers from the Club and lock the main door behind them.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">2</span><span class="text">Lock the cellar, and shut and bolt the back door.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">3</span><span class="text">Check all doors and windows.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">4</span><span class="text">Lock the bandits and put the bandit alarm on.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">5</span><span class="text">Check the toilets.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">6</span><span class="text">Cash up and lock all money away, leaving the till drawer ajar.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">7</span><span class="text">Close all shutters.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">8</span><span class="text">Check the heating is off.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">9</span><span class="text">Pick up the personal alarm.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">10</span><span class="text">Lock the bar doors.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">11</span><span class="text">Turn off all lights.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">12</span><span class="text">Put the alarm on in the hallway.</span>
  </label>
  <label class="item">
    <input type="checkbox" onchange="this.closest('.item').classList.toggle('checked', this.checked)">
    <span class="num">13</span><span class="text">Exit the building, locking the door behind you.</span>
  </label>

  <div class="action-row">
    <a class="back" href="staff-hub.html">← Back to Staff Hub</a>
    <span class="action-btns">
      <button class="reset-btn" onclick="document.querySelectorAll('.item input').forEach(b => { b.checked = false; b.closest('.item').classList.remove('checked'); })">Start again</button>
      <button class="print-btn" onclick="window.print()">Print Checklist</button>
    </span>
  </div>
</main>
<script>
  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const savedTheme = localStorage.getItem('theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
  function applyTheme(theme){
    if(theme === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      themeIcon.textContent = '🌙';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeIcon.textContent = '☀️';
    }
  }
  applyTheme(initialTheme);
  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const newTheme = isDark ? 'light' : 'dark';
    applyTheme(newTheme);
    localStorage.setItem('theme', newTheme);
  });
</script>
<script src="update-banner.js"></script>
</body>
</html>

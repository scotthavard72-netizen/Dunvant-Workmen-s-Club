<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pending Bookings — Dunvant WMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1512;--paper:#f0e6d6;--card:#faf4e8;--line:#ded0b8;--muted:#6b5d4f;--brass:#a67c3d;--brass-light:#c9a05e;--forest:#2d4a35;--pop:#ff7a45;
  }
  [data-theme="dark"]{
    --ink:#ece2d0; --paper:#161210; --card:#211b16; --line:#3a3128; --muted:#a8977f;
    --brass:#c9a05e; --brass-light:#e0bd82; --forest:#4a7a5c;
  --pop:#ff9166;
  }
  body{transition:background 0.25s ease, color 0.25s ease;}
  *, *::before, *::after{transition:background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;}

  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;}
  header{background:linear-gradient(160deg, #1a1512 0%, #16211a 100%); padding:26px 24px; text-align:center;}
  .eyebrow{display:block; font-size:0.68rem; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--brass-light); margin-bottom:8px;}
  header h1{font-family:'Fraunces', serif; font-weight:600; font-size:1.4rem; color:#fff;}
  header p{font-size:0.8rem; color:rgba(255,255,255,0.55); margin-top:4px;}
  main{max-width:680px; margin:0 auto; padding:30px 20px 60px;}
  .notice{background:#fff8ea; border:1px solid var(--line); border-radius:10px; padding:16px 20px; font-size:0.84rem; color:var(--muted); margin-bottom:24px;}
  [data-theme="dark"] .notice{background:#2a2318;}
  .filter-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .filter-btn{
    font-family:'Inter', sans-serif; font-size:0.78rem; font-weight:600; padding:7px 14px; border-radius:16px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--muted);
  }
  .filter-btn.active{background:var(--brass); color:#fff; border-color:var(--brass);}
  .load-status{font-size:0.86rem; color:var(--muted); text-align:center; padding:16px 0;}

  .req{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:14px;}
  .req-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px;}
  .req-top h3{font-family:'Fraunces', serif; font-size:1.05rem; font-weight:600;}
  .status{
    font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    padding:4px 10px; border-radius:20px; white-space:nowrap; flex-shrink:0;
  }
  .status.pending{background:#fff2d9; color:#8a6a1f;}
  .status.approved{background:#e4ece9; color:#2c3f38;}
  .status.declined{background:#fbe4e4; color:#8a2f2f;}
  .details{font-size:0.86rem; color:var(--muted); line-height:1.7; margin-bottom:14px;}
  .details strong{color:var(--ink);}
  .actions{display:flex; gap:10px;}
  .actions button{
    flex:1; font-family:'Inter', sans-serif; font-weight:600; font-size:0.85rem;
    padding:11px 14px; border-radius:8px; cursor:pointer; border:none;
  }
  .approve{background:var(--forest); color:#fff;}
  .decline{background:var(--paper); color:var(--ink); border:1px solid var(--line) !important;}
  a.back{display:inline-block; margin-top:10px; font-size:0.82rem; color:var(--brass); text-decoration:none; font-weight:600;}
  .theme-toggle{
    position:fixed; top:16px; right:16px; z-index:100;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    border-radius:50%; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1.05rem;
  }
  .theme-toggle:hover{border-color:var(--brass-light);}
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"><span id="theme-icon">☀️</span></button>

<header>
  <span class="eyebrow">Management</span>
  <h1>Pending Bookings</h1>
  <p>Function room requests submitted via the public Book page</p>
</header>
<main>
  <div class="notice">Approving a request also adds the date to the public "Already booked" list automatically — no need to do that separately in Manage Bookings.</div>

  <div class="filter-row" id="filter-row"></div>

  <p class="load-status" id="load-status">Loading…</p>
  <div id="req-list"></div>

  <a class="back" href="staff-area.html">← Back to Staff Area</a>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBJ9lzipekmOyh6dkcUlY9oObvpXdv__KE",
    authDomain: "dunvantwmc-36de5.firebaseapp.com",
    projectId: "dunvantwmc-36de5",
    storageBucket: "dunvantwmc-36de5.firebasestorage.app",
    messagingSenderId: "826027608283",
    appId: "1:826027608283:web:e2dfe243f70ac77d5624fe"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
</script>
<script>
  let ALL_DOCS = [];
  let ACTIVE_FILTER = 'pending';
  const FILTERS = ['pending', 'approved', 'declined', 'all'];
  const FILTER_LABELS = { pending: 'Pending', approved: 'Approved', declined: 'Declined', all: 'All' };

  function formatBookingDate(fd){
    if(!fd) return '';
    return new Date(fd + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
  }

  function formatTime12h(t){
    if(!t) return '';
    const [h, m] = t.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${h12}:${m.toString().padStart(2, '0')} ${period}`;
  }

  function renderFilters(){
    document.getElementById('filter-row').innerHTML = FILTERS.map(f =>
      `<span class="filter-btn ${ACTIVE_FILTER === f ? 'active' : ''}" onclick="setFilter('${f}')">${FILTER_LABELS[f]}</span>`
    ).join('');
  }

  function setFilter(f){
    ACTIVE_FILTER = f;
    renderFilters();
    renderList();
  }

  function renderList(){
    const listEl = document.getElementById('req-list');
    const statusEl = document.getElementById('load-status');
    let docs = ALL_DOCS;
    if(ACTIVE_FILTER !== 'all'){
      docs = docs.filter(doc => (doc.data().status || 'pending') === ACTIVE_FILTER);
    }
    if(docs.length === 0){
      listEl.innerHTML = '';
      statusEl.textContent = 'Nothing here.';
      return;
    }
    statusEl.textContent = '';
    listEl.innerHTML = docs.map(doc => {
      const d = doc.data();
      const status = d.status || 'pending';
      const timeRange = (d.startTime || d.endTime) ? `${formatTime12h(d.startTime)} – ${formatTime12h(d.endTime)}` : 'Not specified';
      return `
        <div class="req">
          <div class="req-top">
            <h3>${d.eventName || 'Untitled Event'}</h3>
            <span class="status ${status}">${FILTER_LABELS[status] || status}</span>
          </div>
          <div class="details">
            <strong>Date:</strong> ${formatBookingDate(d.date)}<br>
            <strong>Time:</strong> ${timeRange}<br>
            <strong>Numbers:</strong> ${d.guests ? '~' + d.guests + ' guests' : 'Not specified'}<br>
            <strong>Contact:</strong> ${d.contactName || ''}${d.contactPhone ? ', ' + d.contactPhone : ''}${d.contactEmail ? ' · ' + d.contactEmail : ''}<br>
            ${d.notes ? `<strong>Notes:</strong> ${d.notes}` : ''}
          </div>
          ${status === 'pending' ? `
            <div class="actions">
              <button class="approve" onclick="approveRequest('${doc.id}')">Approve</button>
              <button class="decline" onclick="declineRequest('${doc.id}')">Decline</button>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  async function loadRequests(){
    const statusEl = document.getElementById('load-status');
    try{
      const snap = await db.collection('bookingRequests').get();
      ALL_DOCS = snap.docs.sort((a, b) => (a.data().date || '').localeCompare(b.data().date || ''));
      renderFilters();
      renderList();
    } catch(e){
      statusEl.textContent = "Couldn't load requests right now — " + e.message;
    }
  }

  async function approveRequest(id){
    const doc = ALL_DOCS.find(d => d.id === id);
    if(!doc) return;
    const d = doc.data();
    try{
      await db.collection('bookingRequests').doc(id).update({ status: 'approved' });
      if(d.date){
        await db.collection('bookings').add({
          date: d.date,
          label: d.eventName || 'Private Function',
          createdAtMs: Date.now(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
      loadRequests();
    } catch(e){
      alert("Couldn't approve that — " + e.message);
    }
  }

  async function declineRequest(id){
    if(!confirm('Decline this booking request?')) return;
    try{
      await db.collection('bookingRequests').doc(id).update({ status: 'declined' });
      loadRequests();
    } catch(e){
      alert("Couldn't decline that — " + e.message);
    }
  }

  auth.onAuthStateChanged((user) => {
    if(user){
      loadRequests();
    } else {
      window.location.href = 'staff-area.html';
    }
  });

  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const savedTheme = localStorage.getItem('theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
  function applyTheme(theme){
    if(theme === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      themeIcon.textContent = '🌙';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeIcon.textContent = '☀️';
    }
  }
  applyTheme(initialTheme);
  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const newTheme = isDark ? 'light' : 'dark';
    applyTheme(newTheme);
    localStorage.setItem('theme', newTheme);
  });
</script>
<script src="update-banner.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Team Activity — Dunvant WMC</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/dw-favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/dw-favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1512;--paper:#f0e6d6;--card:#faf4e8;--line:#ded0b8;--muted:#6b5d4f;--brass:#a67c3d;--brass-light:#c9a05e;--forest:#2d4a35;--pop:#ff7a45;}
  [data-theme="dark"]{--ink:#ece2d0;--paper:#161210;--card:#211b16;--line:#3a3128;--muted:#a8977f;--brass:#c9a05e;--brass-light:#e0bd82;--forest:#4a7a5c;--pop:#ff9166;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; transition:background 0.25s ease, color 0.25s ease;}
  *, *::before, *::after{transition:background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;}
  header{background:linear-gradient(160deg, #1a1512 0%, #16211a 100%); padding:calc(26px + env(safe-area-inset-top)) 24px 26px; text-align:center;}
  .eyebrow{display:block; font-size:0.68rem; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--brass-light); margin-bottom:8px;}
  header h1{font-family:'Fraunces', serif; font-weight:600; font-size:1.4rem; color:#fff;}
  header p{font-size:0.8rem; color:rgba(255,255,255,0.55); margin-top:4px;}
  .theme-toggle{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); right:16px; z-index:100;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    border-radius:50%; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.05rem;
  }
  .theme-toggle:hover{border-color:var(--brass-light);}
  main{max-width:560px; margin:0 auto; padding:30px 20px 60px;}
  .notice{background:#fff8ea; border:1px solid var(--line); border-radius:10px; padding:16px 20px; font-size:0.84rem; color:var(--muted); margin-bottom:24px;}
  [data-theme="dark"] .notice{background:#2a2318;}

  .load-status{font-size:0.84rem; color:var(--muted); padding:6px 2px;}
  .empty-note{font-size:0.84rem; color:var(--muted); padding:6px 2px;}

  #activity-list{display:flex; flex-direction:column; gap:8px;}
  .activity-row{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 16px; display:flex; align-items:flex-start; gap:10px;
  }
  .activity-dot{width:8px; height:8px; border-radius:50%; background:var(--brass-light); margin-top:6px; flex-shrink:0;}
  .activity-body{flex:1; min-width:0;}
  .activity-line{font-size:0.9rem;}
  .activity-line strong{color:var(--forest);}
  .activity-detail{font-size:0.82rem; color:var(--muted); margin-top:2px;}
  .activity-time{font-size:0.72rem; color:var(--muted); margin-top:4px;}

  a.back{display:inline-block; margin-top:24px; font-size:0.82rem; color:var(--brass); text-decoration:none; font-weight:600;}
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"><span id="theme-icon">☀️</span></button>

<header>
  <span class="eyebrow">Team</span>
  <h1>Team Activity</h1>
  <p>What's been happening around the site recently</p>
</header>
<main>
  <div class="notice">A running log of the day-to-day stuff — handover notes, cover and swap requests, tickets, rota publishes, and staff access changes. Read-only, visible to everyone.</div>

  <p class="load-status" id="load-status">Loading…</p>
  <div id="activity-list"></div>

  <a class="back" href="staff-hub.html">← Back to Staff Hub</a>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBJ9lzipekmOyh6dkcUlY9oObvpXdv__KE",
    authDomain: "dunvantwmc-36de5.firebaseapp.com",
    projectId: "dunvantwmc-36de5",
    storageBucket: "dunvantwmc-36de5.firebasestorage.app",
    messagingSenderId: "826027608283",
    appId: "1:826027608283:web:e2dfe243f70ac77d5624fe"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
</script>
<script>
  function timeAgo(ms){
    if(!ms) return '';
    const date = new Date(ms);
    return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(text){
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function renderActivityRow(doc){
    const d = doc.data();
    return `
      <div class="activity-row">
        <span class="activity-dot"></span>
        <div class="activity-body">
          <div class="activity-line"><strong>${escapeHtml(d.actorName || 'Someone')}</strong> — ${escapeHtml(d.action || 'did something')}</div>
          ${d.detail ? `<div class="activity-detail">${escapeHtml(d.detail)}</div>` : ''}
          <div class="activity-time">${timeAgo(d.createdAtMs)}</div>
        </div>
      </div>
    `;
  }

  async function loadActivity(showSpinner){
    const listEl = document.getElementById('activity-list');
    const statusEl = document.getElementById('load-status');
    if(showSpinner){
      statusEl.textContent = 'Loading…';
      statusEl.style.display = 'block';
    }
    try{
      const snap = await db.collection('activityLog').get();
      const docs = snap.docs
        .sort((a, b) => (b.data().createdAtMs || 0) - (a.data().createdAtMs || 0))
        .slice(0, 50);
      statusEl.style.display = 'none';
      listEl.innerHTML = docs.length
        ? docs.map(renderActivityRow).join('')
        : '<p class="empty-note">Nothing logged yet.</p>';
    } catch(e){
      if(showSpinner) statusEl.textContent = e.code === 'permission-denied'
        ? "Couldn't load activity — Site Admin needs to update Firestore's access rules for this to work."
        : "Couldn't load activity — try refreshing.";
    }
  }

  auth.onAuthStateChanged((user) => {
    if(!user){
      window.location.href = 'staff-area.html';
      return;
    }
    loadActivity(true);
    setInterval(() => {
      if(document.visibilityState === 'visible') loadActivity(false);
    }, 15000);
  });

  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const savedTheme = localStorage.getItem('theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
  function applyTheme(theme){
    if(theme === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      themeIcon.textContent = '🌙';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeIcon.textContent = '☀️';
    }
  }
  applyTheme(initialTheme);
  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const newTheme = isDark ? 'light' : 'dark';
    applyTheme(newTheme);
    localStorage.setItem('theme', newTheme);
  });
</script>
<script src="update-banner.js"></script>
</body>
</html>
